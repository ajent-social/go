name: go-validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: go-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Reuses delivery.go-validation. Pin is immutable; bump deliberately.
  credential-contracts:
    uses: ajent-social/workflows/.github/workflows/go-validation.yml@2377e766f704dfe984a1e589933b91f2bc3c50a1
    with:
      enable-postgres: true
      timeout-minutes: 10
  boltstore-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - run: GOOS=darwin GOARCH=arm64 go build ./servicecred/boltstore
      - run: GOOS=windows GOARCH=amd64 go build ./servicecred/boltstore
      - run: GOOS=aix GOARCH=ppc64 go build ./servicecred/boltstore
      - run: GOOS=illumos GOARCH=amd64 go build ./servicecred/boltstore
      - run: go build ./servicecred/sqlstore
  unsupported-platform:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./servicecred/boltstore
