name: go-validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  credential-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amsl_servicecred_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AMSL_PGSTORE_TEST_DSN: host=127.0.0.1 user=postgres password=postgres dbname=amsl_servicecred_test sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: GOOS=darwin GOARCH=arm64 go build ./servicecred/boltstore
      - run: GOOS=windows GOARCH=amd64 go build ./servicecred/boltstore
      - run: GOOS=aix GOARCH=ppc64 go build ./servicecred/boltstore
      - run: GOOS=illumos GOARCH=amd64 go build ./servicecred/boltstore
      - run: go build ./servicecred/pgstore
  unsupported-platform:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./servicecred/boltstore
